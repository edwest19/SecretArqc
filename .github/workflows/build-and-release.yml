# .github/workflows/build-and-release.yml
#
# Build -> Test -> Package (MSIX + 3 portable CLI exes) -> Sign (Azure
# Artifact Signing) -> GitHub Release
#
# Written for a VS Code + CLI-only workflow end to end - including CI.
# No Visual Studio, no msbuild.exe, no separately-installed Build Tools.
# MSIX packaging uses the winapp CLI (https://github.com/microsoft/winappCli),
# Microsoft's first-party CLI for MSIX identity/packaging, installed on
# the runner via the official microsoft/setup-WinAppCli action. The three
# CLI tools (MasterKey, SKD, Arqc) are plain self-contained single-file
# .exe publishes - no MSIX involved for those, they're meant to be
# portable (copy to a flash drive / E:\ and run directly).
#
# Local-machine equivalents of what this file does (run from repo root):
#   dotnet restore SecretArqc.slnx
#   dotnet test SecretArqc.Core.Tests/SecretArqc.Core.Tests.csproj -c Release
#   dotnet publish SecretArqc.GenAc/SecretArqc.GenAc.csproj -c Release -r win-x64 --self-contained true -o publish/SecretArqc.GenAc
#   winapp pack publish/SecretArqc.GenAc --manifest SecretArqc.GenAc/Package.appxmanifest --executable SecretArqc.GenAc.exe --output SecretArqc.GenAc.msix
#   dotnet publish SecretArqc.MasterKey/SecretArqc.MasterKey.csproj -c Release -r win-x64 -o publish/SecretArqc.MasterKey
#   dotnet publish SecretArqc.SKD/SecretArqc.SKD.csproj -c Release -r win-x64 -o publish/SecretArqc.SKD
#   dotnet publish SecretArqc.Arqc/SecretArqc.Arqc.csproj -c Release -r win-x64 -o publish/SecretArqc.Arqc
# (the three CLI tools don't need extra publish flags - SelfContained,
# PublishSingleFile, and PublishTrimmed are all baked into their .csproj
# files already, precisely so nobody has to remember command-line flags
# for this - see the MSBuild-reads-environment-variables lesson earlier
# in this project's history.)
# Run that sequence locally first and confirm all four output files exist
# before trusting this workflow in CI.
#
# REQUIRED REPO CONFIGURATION (Settings > Secrets and variables > Actions):
#   Secrets:
#     AZURE_CLIENT_ID        - App registration (federated credential) client ID
#     AZURE_TENANT_ID        - Entra tenant ID
#     AZURE_SUBSCRIPTION_ID  - Subscription containing the Artifact Signing account
#   Variables:
#     RUN_SIGNING            - 'true' or 'false'
#
# You must have already configured a federated credential on the Azure
# app registration scoped to a GitHub Environment (not a branch/tag ref -
# Azure federated credentials can't wildcard-match tags), subject:
#   repo:<owner>/SecretArqc:environment:release
# This avoids storing any client secret in GitHub at all. The GitHub
# Environment named "release" must exist in this repo's Settings >
# Environments, and the sign-and-release job below is scoped to it.
#
# NOTE ON SIGNING THE CLI EXES: unlike the MSIX, a plain .exe has no
# manifest-identity/Publisher matching requirement - Authenticode signing
# of a standalone executable is simpler than MSIX in that respect. Signing
# them does NOT make Windows SmartScreen skip its warning on first
# download (Microsoft removed "instant EV-style trust" in 2024 - even a
# Public Trust cert has to build reputation through real download volume
# like any other). The real reasons to sign them: Windows 11's Smart App
# Control can block unsigned executables outright, and reputation can only
# start building on a file that's consistently signed.
#
# NOTE ON PUBLISHER IDENTITY (MSIX only): the Publisher in
# Package.appxmanifest must exactly match your Azure Artifact Signing
# certificate profile's Subject (case-sensitive) or signing/updates will
# break.

name: Build, Sign, and Release SecretArqc

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_signing:
        description: "Override RUN_SIGNING for this manual run (true/false)"
        required: false
        default: ""

permissions:
  id-token: write   # required for OIDC login to Azure (no stored client secret)
  contents: write   # required to publish a GitHub Release

env:
  SOLUTION_PATH: SecretArqc.slnx
  PROJECT_PATH: SecretArqc.GenAc/SecretArqc.GenAc.csproj
  MANIFEST_PATH: SecretArqc.GenAc/Package.appxmanifest
  TEST_PROJECT_PATH: SecretArqc.Core.Tests/SecretArqc.Core.Tests.csproj
  PUBLISH_DIR: publish/SecretArqc.GenAc
  PACKAGE_NAME: SecretArqc.GenAc.msix
  MASTERKEY_PROJECT_PATH: SecretArqc.MasterKey/SecretArqc.MasterKey.csproj
  SKD_PROJECT_PATH: SecretArqc.SKD/SecretArqc.SKD.csproj
  ARQC_PROJECT_PATH: SecretArqc.Arqc/SecretArqc.Arqc.csproj
  MASTERKEY_PUBLISH_DIR: publish/SecretArqc.MasterKey
  SKD_PUBLISH_DIR: publish/SecretArqc.SKD
  ARQC_PUBLISH_DIR: publish/SecretArqc.Arqc
  BUILD_PLATFORM: x64
  BUILD_CONFIGURATION: Release

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Official Microsoft action - installs the winapp CLI used for
      # MSIX packaging below. No VS/Build Tools install involved.
      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # Core.Tests doesn't exist until the EMV code is ported in (Phase 4).
      # Skip gracefully rather than fail the whole pipeline on a project
      # that isn't built yet - but once it exists, this always runs it.
      - name: Check for test project
        id: check_tests
        shell: pwsh
        run: |
          if (Test-Path "${{ env.TEST_PROJECT_PATH }}") {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Test project not found at ${{ env.TEST_PROJECT_PATH }} - skipping. Expected until Core.Tests is ported in."
          }

      - name: Run tests
        if: steps.check_tests.outputs.exists == 'true'
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      # --self-contained true: the WinUI3 template's Release config enables
      # assembly trimming, which NETSDK1102 refuses to do for a
      # framework-dependent publish. Self-contained is also the right
      # choice here regardless, since users installing from GitHub
      # Releases can't be assumed to have .NET 10 preinstalled.
      - name: Publish GenAc app (self-contained, win-${{ env.BUILD_PLATFORM }})
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c ${{ env.BUILD_CONFIGURATION }}
          -r win-${{ env.BUILD_PLATFORM }}
          --self-contained true
          -o ${{ env.PUBLISH_DIR }}

      # --executable: WindowsAppSdkSelfContained bundles extra .exe files
      # from the Windows App SDK runtime alongside the app's own, so
      # winapp pack's auto-detection (exactly one .exe) is ambiguous now.
      - name: Package MSIX (unsigned)
        run: >
          winapp pack ${{ env.PUBLISH_DIR }}
          --manifest ${{ env.MANIFEST_PATH }}
          --executable SecretArqc.GenAc.exe
          --output ${{ env.PACKAGE_NAME }}

      - name: Verify MSIX package was created
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.PACKAGE_NAME }}")) {
            Write-Error "Package not found - check the 'Package MSIX' step output above."
            exit 1
          }

      # The three CLI tools: portable, self-contained, single-file, trimmed
      # (all baked into each .csproj already). No packaging step needed -
      # dotnet publish alone produces one .exe per project.
      - name: Publish CLI tools (self-contained, single-file, win-${{ env.BUILD_PLATFORM }})
        run: >
          dotnet publish ${{ env.MASTERKEY_PROJECT_PATH }} -c ${{ env.BUILD_CONFIGURATION }} -r win-${{ env.BUILD_PLATFORM }} -o ${{ env.MASTERKEY_PUBLISH_DIR }} &&
          dotnet publish ${{ env.SKD_PROJECT_PATH }} -c ${{ env.BUILD_CONFIGURATION }} -r win-${{ env.BUILD_PLATFORM }} -o ${{ env.SKD_PUBLISH_DIR }} &&
          dotnet publish ${{ env.ARQC_PROJECT_PATH }} -c ${{ env.BUILD_CONFIGURATION }} -r win-${{ env.BUILD_PLATFORM }} -o ${{ env.ARQC_PUBLISH_DIR }}

      - name: Copy CLI exes to repo root and verify
        shell: pwsh
        run: |
          Copy-Item "${{ env.MASTERKEY_PUBLISH_DIR }}\SecretArqc.MasterKey.exe" -Destination "SecretArqc.MasterKey.exe"
          Copy-Item "${{ env.SKD_PUBLISH_DIR }}\SecretArqc.SKD.exe" -Destination "SecretArqc.SKD.exe"
          Copy-Item "${{ env.ARQC_PUBLISH_DIR }}\SecretArqc.Arqc.exe" -Destination "SecretArqc.Arqc.exe"
          foreach ($f in @("SecretArqc.MasterKey.exe", "SecretArqc.SKD.exe", "SecretArqc.Arqc.exe")) {
            if (-not (Test-Path $f)) {
              Write-Error "$f not found - check the 'Publish CLI tools' step output above."
              exit 1
            }
          }

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifacts
          path: |
            ${{ env.PACKAGE_NAME }}
            SecretArqc.MasterKey.exe
            SecretArqc.SKD.exe
            SecretArqc.Arqc.exe

  sign-and-release:
    needs: build-and-package
    runs-on: windows-latest
    # Tied to a GitHub Environment (not a branch/tag ref) because Azure
    # federated credentials cannot wildcard-match tag refs - each exact
    # tag would otherwise need its own credential. The environment name
    # is what the federated credential's Subject is scoped to in Azure,
    # not "refs/heads/main" or any specific tag.
    environment: release
    if: ${{ (github.event.inputs.run_signing || vars.RUN_SIGNING) == 'true' }}
    steps:
      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          name: unsigned-artifacts

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # files-folder-filter covers both the MSIX and the three CLI exes -
      # they all sign in this one pass. See the header note on why the
      # exes not showing "instant SmartScreen trust" is still expected.
      - name: Sign with Azure Artifact Signing
        uses: azure/trusted-signing-action@v1
        with:
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: edwest19
          certificate-profile-name: CodeSigning-Apps
          files-folder: ${{ github.workspace }}
          files-folder-filter: msix,exe
          files-folder-recurse: false

      - name: Create GitHub Release with signed package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SecretArqc.GenAc.msix
            SecretArqc.MasterKey.exe
            SecretArqc.SKD.exe
            SecretArqc.Arqc.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
